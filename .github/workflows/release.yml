name: Release

# Publishes on a version tag, and by hand from the Actions tab. Tag pushes run
# only once the repository variable NPM_PUBLISH_ENABLED is set to "true", so a
# tag does not turn red before the registry side exists. Requires an NPM_TOKEN
# secret (an automation token with publish rights) and a public repository for
# provenance.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # `prepublishOnly` re-runs typecheck + tests and `prepare` builds dist/.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
